<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111419"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Night City Match Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#dce1e6;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}main{width:min(100%,560px);background:#111419;border:1px solid #41454d;padding:18px;border-radius:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(18px,5vw,25px);color:#f6ef42;margin:0;font-weight:850;letter-spacing:-.7px}header span{color:#f6ef42;font-size:26px}section{border-top:1px solid #41454d;margin-top:18px;padding-top:16px}h2{font-size:12px;color:#aab4bf;letter-spacing:1.5px;margin:0 0 12px}.track{display:grid;gap:5px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.state{border:1px solid transparent;background:#252b32;color:#dce1e6;border-radius:5px;min-height:82px;padding:8px 2px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:clamp(9px,2.7vw,12px);font-weight:800;line-height:1.2;text-align:center}.state .dot{font-size:23px;color:#68717d}.state[aria-pressed=true]{background:var(--active);color:#111419;border-color:var(--active)}.state[aria-pressed=true] .dot{color:#111419}.description{font-size:13px;font-weight:700;text-align:center;margin:15px 0 4px;min-height:34px;display:grid;place-items:center;letter-spacing:.3px}footer{border-top:1px solid #41454d;margin-top:15px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;color:#87929e}footer b{color:#f6ef42}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;background:transparent;border:1px solid #41454d;color:#dce1e6;border-radius:5px;padding:12px;font-size:12px;font-weight:700}.actions button:active{background:#252b32}button:focus-visible{outline:2px solid white;outline-offset:3px}#install{display:none}.note{font-size:11px;color:#87929e;line-height:1.5;margin:16px 0 0} 
:root{--bg:#0b0e12;--panel:#111419;--accent:#f6ef42;--line:#41454d;--tile:#252b32;--fg:#dce1e6}body{background:var(--bg);color:var(--fg)}main{background:var(--panel);border-color:var(--line)}h1,header span,footer b{color:var(--accent)}section,footer{border-color:var(--line)}.state{background:var(--tile);color:var(--fg)}.actions button,.control{border:1px solid var(--line);color:var(--fg);background:var(--panel);border-radius:5px;padding:10px;font:inherit}.actions button:disabled{opacity:.35}.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.settings label{font-size:12px}.settings select{max-width:100%}.status{font-size:11px;color:#aab4bf;min-height:16px;margin:6px 0}.note{margin-top:8px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><h1>NIGHT CITY // TRACKER</h1><span aria-hidden="true">▣</span></header><section><h2>01 // GAME STATUS</h2><div class="track" id="ot" style="--n:4"></div><div class="description" id="ot-desc" aria-live="polite"></div></section><section><h2>02 // ROUND END</h2><div class="track" id="re" style="--n:5"></div><div class="description" id="re-desc" aria-live="polite"></div></section><footer><span>TOURNAMENT EDITION // 26.11</span><b>V1.1.0</b></footer><div class="actions"><button id="undo">↶ UNDO</button><button id="reset">↻ RESET MATCH</button><button id="install">INSTALL APP</button></div><div class="settings"><label><input type="checkbox" id="awake"> Keep screen awake</label><label><input type="checkbox" id="haptic"> Vibration</label></div><p class="status" id="status" aria-live="polite"></p><button class="control" id="update" hidden>UPDATE AVAILABLE · RELOAD</button><p class="note">Manual tracker · Tap a state to update it. Ask the Head Judge before using electronic devices during tournament play.</p></main><script src="app.js"></script></body></html>
