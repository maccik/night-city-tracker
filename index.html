<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111419"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Night City Match Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#dce1e6;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}main{width:min(100%,560px);background:#111419;border:1px solid #41454d;padding:18px;border-radius:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(18px,5vw,25px);color:#f6ef42;margin:0;font-weight:850;letter-spacing:-.7px}header span{color:#f6ef42;font-size:26px}section{border-top:1px solid #41454d;margin-top:18px;padding-top:16px}h2{font-size:12px;color:#aab4bf;letter-spacing:1.5px;margin:0 0 12px}.track{display:grid;gap:5px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.state{border:1px solid transparent;background:#252b32;color:#dce1e6;border-radius:5px;min-height:82px;padding:8px 2px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:clamp(9px,2.7vw,12px);font-weight:800;line-height:1.2;text-align:center}.state .dot{font-size:23px;color:#68717d}.state[aria-pressed=true]{background:var(--active);color:#111419;border-color:var(--active)}.state[aria-pressed=true] .dot{color:#111419}.description{font-size:13px;font-weight:700;text-align:center;margin:15px 0 4px;min-height:34px;display:grid;place-items:center;letter-spacing:.3px}footer{border-top:1px solid #41454d;margin-top:15px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;color:#87929e}footer b{color:#f6ef42}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;background:transparent;border:1px solid #41454d;color:#dce1e6;border-radius:5px;padding:12px;font-size:12px;font-weight:700}.actions button:active{background:#252b32}button:focus-visible{outline:2px solid white;outline-offset:3px}#install{display:none}.note{font-size:11px;color:#87929e;line-height:1.5;margin:16px 0 0} </style></head><body><main><header><h1>NIGHT CITY // TRACKER</h1><span aria-hidden="true">▣</span></header><section><h2>01 // GAME STATUS</h2><div class="track" id="ot" style="--n:4"></div><div class="description" id="ot-desc" aria-live="polite"></div></section><section><h2>02 // ROUND END</h2><div class="track" id="re" style="--n:5"></div><div class="description" id="re-desc" aria-live="polite"></div></section><footer><span>TOURNAMENT EDITION // 26.11</span><b>NC-01</b></footer><div class="actions"><button id="reset">↻ RESET MATCH</button><button id="install">INSTALL APP</button></div><p class="note">Manual tracker · Tap a state to update it. Ask the Head Judge before using electronic devices during tournament play.</p></main><script>
const tracks={ot:{labels:['NORMAL','NO GIGS 1','NO GIGS 2','OVERTIME'],colors:['#22d3be','#f6ef42','#f6ef42','#fa465c'],desc:['STANDARD PLAY','EMPTY FIXERS · TURN 1/2','EMPTY FIXERS · TURN 2/2','7+ GIGS = INSTANT WIN']},re:{labels:['OFF','TURN 0','TURN 1','TURN 2','TURN 3'],colors:['#45c9ef','#45c9ef','#45c9ef','#45c9ef','#fa465c'],desc:['ROUND IN PROGRESS','FINISH CURRENT TURN','3 TURNS REMAINING','2 TURNS REMAINING','FINAL TURN']}};let state={ot:0,re:0};try{const saved=JSON.parse(localStorage.getItem('nc-tracker-v1'));for(const k of Object.keys(tracks))if(Number.isInteger(saved?.[k])&&saved[k]>=0&&saved[k]<tracks[k].labels.length)state[k]=saved[k]}catch{}function save(){try{localStorage.setItem('nc-tracker-v1',JSON.stringify(state))}catch{}}function render(){for(const [k,t] of Object.entries(tracks)){const el=document.getElementById(k);Array.from(el.children).forEach((b,i)=>{b.setAttribute('aria-pressed',String(state[k]===i));b.querySelector('.dot').textContent=state[k]===i?'◉':'○'});const d=document.getElementById(k+'-desc');d.textContent=t.desc[state[k]];d.style.color=k==='re'||state[k]===3?t.colors[state[k]]:'#dce1e6'}}for(const [k,t] of Object.entries(tracks)){t.labels.forEach((label,i)=>{const b=document.createElement('button');b.className='state';b.style.setProperty('--active',t.colors[i]);b.innerHTML='<span>'+label+'</span><span class="dot" aria-hidden="true"></span>';b.addEventListener('click',()=>{state[k]=i;save();render()});document.getElementById(k).append(b)})}render();document.getElementById('reset').onclick=()=>{if(confirm('Reset both trackers?')){state={ot:0,re:0};save();render()}};let prompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;document.getElementById('install').style.display='block'});document.getElementById('install').onclick=async()=>{if(prompt){await prompt.prompt();prompt=null;document.getElementById('install').style.display='none'}};if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
